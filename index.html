<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa interactivo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background:#fafafa; }
    h1 { max-width: 980px; margin: 0 auto 14px; }

    .toolbar{
      max-width: 520px;
      margin: 0 auto 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      background:#fff;
      border:1px solid #eee;
      border-radius:12px;
      padding:10px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.05);
      font-size: 14px;
    }
    .toolbar .left{ display:flex; gap:10px; align-items:center; }
    .toggle{ display:flex; align-items:center; gap:8px; user-select:none; }
    .toggle input{ width: 18px; height: 18px; }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:12px;
      white-space: nowrap;
    }
    .btn{
      border:0; background:#eee; padding:8px 10px; border-radius:10px; cursor:pointer;
    }

    .map-wrap{
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      background:#fff;
      border:1px solid #eee;
    }
    .map-wrap img{ width: 100%; height: auto; display: block; }

    /* 🔴 Puntos rojos */
    .dot{
      position:absolute;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #e11d48; /* rojo */
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
    }
    .dot:hover{ transform: translate(-50%, -50%) scale(1.08); }
    .dot:focus{ outline: 3px solid rgba(255,255,255,.75); }

    .help{
      max-width: 520px;
      margin: 10px auto 0;
      color:#555;
      font-size: 13px;
      line-height: 1.4;
    }
    code{ background:#fff; border:1px solid #eee; padding:2px 6px; border-radius:8px; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.55);
      padding: 18px;
      z-index: 9999;
    }
    .modal.open{ display: grid; }
    .modal-card{
      width: min(560px, 100%);
      background: white;
      border-radius: 14px;
      padding: 16px 16px 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .modal-header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom: 8px;
    }
    .modal-title{ margin:0; font-size: 18px; }
    .meta{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid #f0f0f0;
      color:#666;
      font-size: 13px;
    }

    h1{
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Mapa interactivo</h1>



  <div class="map-wrap" id="mapWrap">
    <img src="mapa.png" alt="Mapa" id="mapImg" />

    <!-- 🔴 PUNTOS AL LADO DE LOS NOMBRES (ajustables) -->

    <!-- Loop Stage -->
    <button class="dot" style="left: 20.70%; top: 14.39%;" data-id="loop_stage" aria-label="Loop Stage"></button>

    <!-- Escenario Principal -->
    <button class="dot" style="left: 74.80%; top: 20.05%;" data-id="escenario_principal" aria-label="Escenario Principal"></button>

    <!-- Basoa Stage -->
    <button class="dot" style="left: 55.47%; top: 30.37%;" data-id="basoa_stage" aria-label="Basoa Stage"></button>

    <!-- ENTRADA (la grande de arriba/centro izquierda) -->
    <button class="dot" style="left: 25.10%; top: 51.40%;" data-id="entrada_1" aria-label="Entrada 1"></button>

    <!-- Zona Saturada -->
    <button class="dot" style="left: 76.27%; top: 51.63%;" data-id="zona_saturada" aria-label="Zona Saturada"></button>

    <!-- Restaurante (el del centro) -->
    <button class="dot" style="left: 43.55%; top: 61.91%;" data-id="restaurante_1" aria-label="Restaurante 1"></button>

    <!-- Área de Descanso -->
    <button class="dot" style="left: 72.07%; top: 63.87%;" data-id="area_descanso" aria-label="Área de Descanso"></button>

    <!-- Lasai Stage -->
    <button class="dot" style="left: 48.54%; top: 72.46%;" data-id="lasai_stage" aria-label="Lasai Stage"></button>

    <!-- Zona seftanías -->
    <button class="dot" style="left: 56.64%; top: 85.12%;" data-id="zona_seftanias" aria-label="Zona seftanías"></button>


    <!-- ✅ APROXIMADOS (ajústalos con Modo colocar) -->

    <!-- Pop Stage -->
    <button class="dot" style="left: 12%; top: 32%;" data-id="pop_stage" aria-label="Pop Stage"></button>

    <!-- Dance Stage -->
    <button class="dot" style="left: 10%; top: 50%;" data-id="dance_stage" aria-label="Dance Stage"></button>

    <!-- Victoria Stage -->
    <button class="dot" style="left: 12%; top: 66%;" data-id="victoria_stage" aria-label="Victoria Stage"></button>

    <!-- Bereziak Stage (dos rótulos) -->
    <button class="dot" style="left: 76%; top: 41%;" data-id="bereziak_1" aria-label="Bereziak Stage 1"></button>
    <button class="dot" style="left: 84%; top: 52%;" data-id="bereziak_2" aria-label="Bereziak Stage 2"></button>

    <!-- Firestone -->
    <button class="dot" style="left: 78%; top: 74%;" data-id="firestone" aria-label="Firestone"></button>

    <!-- Exits (3) -->
    <button class="dot" style="left: 86%; top: 22%;" data-id="exit_1" aria-label="Exit 1"></button>
    <button class="dot" style="left: 90%; top: 36%;" data-id="exit_2" aria-label="Exit 2"></button>
    <button class="dot" style="left: 86%; top: 44%;" data-id="exit_3" aria-label="Exit 3"></button>

    <!-- WC (3) -->
    <button class="dot" style="left: 29%; top: 48%;" data-id="wc_1" aria-label="WC 1"></button>
    <button class="dot" style="left: 28%; top: 58%;" data-id="wc_2" aria-label="WC 2"></button>
    <button class="dot" style="left: 21%; top: 86%;" data-id="wc_3" aria-label="WC 3"></button>

    <!-- Restaurantes extra -->
    <button class="dot" style="left: 86%; top: 57%;" data-id="restaurante_2" aria-label="Restaurante 2"></button>
    <button class="dot" style="left: 83%; top: 88%;" data-id="restaurante_3" aria-label="Restaurante 3"></button>

    <!-- ENTRADA inferior -->
    <button class="dot" style="left: 16%; top: 79%;" data-id="entrada_2" aria-label="Entrada 2"></button>
  </div>



  <!-- MODAL -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="btn" id="closeBtn" type="button">Cerrar</button>
      </div>
      <p id="modalBody"></p>
      <div class="meta" id="modalMeta"></div>
    </div>
  </div>

  <script>
    // ✅ Info por punto (edita aquí)
    const info = {
      escenario_principal: { title: "Escenario Principal", body: "Espacio central del festival donde actúan los artistas principales. El mapa permite consultar horarios, próximos conciertos y rutas recomendadas para llegar evitando zonas saturadas. Incluye avisos de seguridad y salidas cercanas para una evacuación rápida si fuese necesario.." },
      loop_stage: { title: "Loop Stage", body: "Escenario secundario rodeado de naturaleza, con actuaciones continuas. Desde el mapa se puede ver la programación, el nivel de ocupación en tiempo real y el mejor acceso según la afluencia de público.." },
      basoa_stage: { title: "Basoa Stage", body: "Escenario inmerso en un entorno boscoso, muy concurrido en determinados horarios. El mapa avisa cuando la zona está cerca de saturarse y propone rutas alternativas para acceder o salir de forma segura.." },
      pop_stage: { title: "Pop Stage", body: "Zona dedicada a conciertos de estilo pop e indie. El mapa muestra servicios cercanos como baños y restaurantes, facilitando la planificación antes y después de los conciertos." },
      dance_stage: { title: "Dance Stage", body: "Escenario de música electrónica con alta concentración de público por la noche. El mapa incluye recomendaciones de hidratación, puntos WC cercanos y rutas de salida menos congestionadas." },
      victoria_stage: { title: "Victoria Stage", body: "Añade aquí info del Victoria Stage." },
      lasai_stage: { title: "Lasai Stage", body: "Añade aquí info del Lasai Stage." },
      firestone: { title: "Firestone", body: "Añade aquí info de esta zona/escenario." },

      bereziak_1: { title: "Bereziak Stage (1)", body: "Info de este rótulo." },
      bereziak_2: { title: "Bereziak Stage (2)", body: "Info de este rótulo." },

      zona_saturada: { title: "Zona Saturada", body: "Zona con mucha gente. Usa rutas alternativas / evita horas punta." },
      area_descanso: { title: "Área de Descanso", body: "Zona para parar, respirar y recuperar." },

      restaurante_1: { title: "Restaurante (1)", body: "Comida y bebida. Info de horarios." },
      restaurante_2: { title: "Restaurante (2)", body: "Comida y bebida. Info de horarios." },
      restaurante_3: { title: "Restaurante (3)", body: "Comida y bebida. Info de horarios." },

      entrada_1: { title: "Entrada (1)", body: "Acceso principal. Info de entradas." },
      entrada_2: { title: "Entrada (2)", body: "Acceso inferior. Info de entradas." },

      exit_1: { title: "Exit (1)", body: "Salida superior." },
      exit_2: { title: "Exit (2)", body: "Salida media." },
      exit_3: { title: "Exit (3)", body: "Salida inferior." },

      wc_1: { title: "WC (1)", body: "Baños (zona media)." },
      wc_2: { title: "WC (2)", body: "Baños (zona centro)." },
      wc_3: { title: "WC (3)", body: "Baños (zona inferior)." },

      zona_seftanias: { title: "Zona seftanías", body: "Describe qué es esta zona y sus normas/horarios." }
    };

    // Modal
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalMeta = document.getElementById("modalMeta");
    const closeBtn = document.getElementById("closeBtn");

    document.querySelectorAll(".dot").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const data = info[id] || { title: "Punto", body: "Añade información para este punto." };

        modalTitle.textContent = data.title;
        modalBody.textContent = data.body;
        modalMeta.textContent = `ID: ${id}`;
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    // Modo colocar (sin alerts) + copiar coords
    const placeMode = document.getElementById("placeMode");
    const coordsPill = document.getElementById("coordsPill");
    const copyBtn = document.getElementById("copyBtn");
    const mapWrap = document.getElementById("mapWrap");
    const mapImg = document.getElementById("mapImg");
    let lastCoords = "";

    mapWrap.addEventListener("click", (e) => {
      if (!placeMode.checked) return;
      if (e.target.classList.contains("dot")) return;

      const rect = mapImg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const left = (x / rect.width) * 100;
      const top = (y / rect.height) * 100;

      lastCoords = `left: ${left.toFixed(2)}%; top: ${top.toFixed(2)}%;`;
      coordsPill.textContent = lastCoords;
    });

    copyBtn.addEventListener("click", async () => {
      if (!lastCoords) return;
      try{
        await navigator.clipboard.writeText(lastCoords);
        coordsPill.textContent = lastCoords + " (copiado)";
        setTimeout(() => coordsPill.textContent = lastCoords, 900);
      }catch{
        coordsPill.textContent = lastCoords + " (cópialo a mano)";
      }
    });
  </script>
</body>
</html>
